[project]
name = "agentcore"
version = "0.1.0"
description = "Strands Agent runtime for Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "memory",
    "recommendation",
    "bedrock-agentcore>=1.2.0",
    "strands-agents[otel]>=1.24.0",
    "aws-opentelemetry-distro>=0.10.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.0",
]

[tool.uv.sources]
memory = { workspace = true }
recommendation = { workspace = true }
