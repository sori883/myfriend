[project]
name = "memory"
version = "0.1.0"
description = "Shared memory module for AI agent system"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
